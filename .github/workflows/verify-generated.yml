# 本仓库有四个文件是 workshop 的生成产物，不接受人工编辑：
#   config/clang-format-config, config/vswiftformatconfig,
#   hooks/xcindent.py, hooks/check_blocked_words.py
#
# 规则改动一律提到 workshop（BaiTu-iOS/workshop 的 plugins/ios-dev-rules 等），
# 发 tag 后由那边的 sync-git-hooks workflow 自动推回来。直接改这里会被本 CI 拦下，
# 且下次同步时被覆盖。
#
# 注：workshop 是私有库，本 CI 无法拉取源做内容比对，只做自洽校验
# （生成头是否还在、版本号两处是否一致）。逐字节一致性由 workshop 侧的
# tools/verify-sync.sh 在开发机上保证。
name: verify-generated

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 生成物未被人工编辑
        run: |
          set -euo pipefail
          FAILED=0
          for f in config/clang-format-config \
                   config/vswiftformatconfig \
                   hooks/xcindent.py \
                   hooks/check_blocked_words.py; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::生成物缺失"
              FAILED=1
            elif ! head -12 "$f" | grep -q 'AUTO-GENERATED BY workshop'; then
              echo "::error file=$f::缺少 AUTO-GENERATED 头 —— 该文件由 workshop 生成，请勿直接编辑；规则改动提到 workshop 后发 tag 自动同步"
              FAILED=1
            else
              echo "✓ $f"
            fi
          done
          exit $FAILED

      - name: 版本号两处一致
        run: |
          set -euo pipefail
          # WuKong 读的是 hooks/pre-commit 的 VERSION，install.sh 读的是 .version，
          # 两处不一致会让成员看到的版本号取决于走哪条路径。
          V_FILE="$(tr -d '[:space:]' < .version)"
          V_HOOK="$(sh hooks/pre-commit --version | sed 's/Version: //')"
          if [ "$V_FILE" != "$V_HOOK" ]; then
            echo "::error::版本号不一致 — .version=$V_FILE  hooks/pre-commit=$V_HOOK"
            exit 1
          fi
          echo "✓ 版本号一致: $V_FILE"

      - name: 回归测试
        run: python3 -m unittest discover -s tests -v
